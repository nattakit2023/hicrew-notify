services:
  quota-alert:
    build: .
    container_name: quota-alert
    restart: unless-stopped         # ตาย/รีบูตเครื่อง -> ขึ้นเอง
    env_file: .env
    environment:
      STATE_FILE: /app/data/state.json
      REFRESH_TOKEN_FILE: /app/data/token-store.json
    volumes:
      - ./data:/app/data            # state + token + log + heartbeat (ต้อง persist)
    healthcheck:
      test:
        - CMD-SHELL
        - read ts code < /app/data/heartbeat && now=$$(date +%s) && [ $$((now-ts)) -lt 5400 ] && [ "$$code" = "0" ]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 15m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
